name: Update headlines

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 minutes, off the top of the hour when GitHub is busiest
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths-ignore: ["data/news.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: musk-wire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch headlines
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/fetch_news.py

      - name: Save new headlines
        run: |
          git config user.name "musk-wire-bot"
          git config user.email "musk-wire-bot@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update headlines"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
